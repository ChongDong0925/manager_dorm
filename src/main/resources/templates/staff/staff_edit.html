<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑人员 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fa fa-edit"></i> 编辑人员</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form action="/staff/update" method="post">
                            <input type="hidden" name="id" th:value="${staff.id}">
                            <div class="mb-3">
                                <label for="staffId" class="form-label">工号</label>
                                <input type="text" class="form-control" id="staffId" name="staffId" th:value="${staff.staffId}" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">姓名</label>
                                <input type="text" class="form-control" id="name" name="name" th:value="${staff.name}" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">电话</label>
                                <input type="text" class="form-control" id="phone" name="phone" th:value="${staff.phone}" required>
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">部门</label>
                                <input type="text" class="form-control" id="department" name="department" th:value="${staff.department}" required>
                            </div>
                            <div class="mb-3">
                                <label for="team" class="form-label">班组</label>
                                <input type="text" class="form-control" id="team" name="team" th:value="${staff.team}" required>
                            </div>
                            <div class="mb-3">
                                <label for="position" class="form-label">职位</label>
                                <input type="text" class="form-control" id="position" name="position" th:value="${staff.position}" required>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">状态</label>
                                <select class="form-select" id="status" name="status" required>
                                    <option value="在职" th:selected="${staff.status == '在职'}">在职</option>
                                    <option value="离职" th:selected="${staff.status == '离职'}">离职</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/staff/list" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">保存修改</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
