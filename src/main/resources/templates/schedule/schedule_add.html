<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增/编辑排班 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fa fa-calendar"></i> <span th:if="${schedule != null}">编辑排班</span><span th:unless="${schedule != null}">新增排班</span></h3>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/schedule/save}" method="post">
                            <input type="hidden" id="id" name="id" th:value="${schedule?.id}">
                            <div class="mb-3">
                                <label for="scheduleDate" class="form-label">排班日期</label>
                                <input type="date" class="form-control" id="scheduleDate" name="scheduleDate" th:value="${schedule?.scheduleDate}" required>
                            </div>
                            <div class="mb-3">
                                <label for="staffId" class="form-label">人员</label>
                                <select class="form-select" id="staffId" name="staffId" required>
                                    <option th:each="staff : ${staffs}" th:value="${staff.id}" th:text="${staff.name}" th:selected="${schedule?.staffId == staff.id}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="shift" class="form-label">班次</label>
                                <select class="form-select" id="shift" name="shift" required>
                                    <option value="早班" th:selected="${schedule?.shift == '早班'}">早班</option>
                                    <option value="中班" th:selected="${schedule?.shift == '中班'}">中班</option>
                                    <option value="晚班" th:selected="${schedule?.shift == '晚班'}">晚班</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startTime" class="form-label">开始时间</label>
                                    <input type="time" class="form-control" id="startTime" name="startTime" th:value="${schedule?.startTime}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="endTime" class="form-label">结束时间</label>
                                    <input type="time" class="form-control" id="endTime" name="endTime" th:value="${schedule?.endTime}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="position" class="form-label">值班岗位</label>
                                <input type="text" class="form-control" id="position" name="position" th:value="${schedule?.position}" required>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">状态</label>
                                <select class="form-select" id="status" name="status" required>
                                    <option value="正常" th:selected="${schedule?.status == '正常'}">正常</option>
                                    <option value="调班" th:selected="${schedule?.status == '调班'}">调班</option>
                                    <option value="请假" th:selected="${schedule?.status == '请假'}">请假</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="remark" class="form-label">备注</label>
                                <textarea class="form-control" id="remark" name="remark" rows="3" th:text="${schedule?.remark}"></textarea>
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                                <a href="/schedule/list" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> 返回</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
