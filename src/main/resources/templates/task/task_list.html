<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fa fa-tasks"></i> 任务管理</h3>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-12">
                <a href="/task/add" class="btn btn-primary"><i class="fa fa-plus"></i> 新增任务</a>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>任务编号</th>
                                    <th>任务类型</th>
                                    <th>宿舍号</th>
                                    <th>楼栋</th>
                                    <th>分配人员</th>
                                    <th>优先级</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="task : ${tasks}">
                                    <td th:text="${task.taskId}"></td>
                                    <td th:text="${task.taskType}"></td>
                                    <td th:text="${task.dormNumber}"></td>
                                    <td th:text="${task.building}"></td>
                                    <td th:text="${task.assignStaffName}"></td>
                                    <td>
                                        <span th:if="${task.priority == '高'}" class="badge bg-danger">高</span>
                                        <span th:if="${task.priority == '中'}" class="badge bg-warning">中</span>
                                        <span th:if="${task.priority == '低'}" class="badge bg-success">低</span>
                                    </td>
                                    <td>
                                        <span th:if="${task.status == '待处理'}" class="badge bg-info">待处理</span>
                                        <span th:if="${task.status == '处理中'}" class="badge bg-warning">处理中</span>
                                        <span th:if="${task.status == '已完成'}" class="badge bg-success">已完成</span>
                                        <span th:if="${task.status == '已取消'}" class="badge bg-danger">已取消</span>
                                    </td>
                                    <td th:text="${task.createTime}"></td>
                                    <td>
                                        <a th:href="@{/task/detail(id=${task.id})}" class="btn btn-sm btn-info"><i class="fa fa-eye"></i> 查看</a>
                                        <a th:href="@{/task/edit(id=${task.id})}" class="btn btn-sm btn-primary"><i class="fa fa-edit"></i> 编辑</a>
                                        <a th:href="@{/task/delete(id=${task.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除吗？');"><i class="fa fa-trash"></i> 删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
