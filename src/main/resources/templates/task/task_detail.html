<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/static/plugins/bootstrap-5.3.0/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/static/plugins/font-awesome-6.4.0/css/all.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fas fa-tasks"></i> 任务详情</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">任务编号</label>
                                    <p class="form-control-plaintext" th:text="${task.taskId}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">任务类型</label>
                                    <p class="form-control-plaintext" th:text="${task.taskType}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">宿舍号</label>
                                    <p class="form-control-plaintext" th:text="${task.dormNumber}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">楼栋</label>
                                    <p class="form-control-plaintext" th:text="${task.building}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">分配人员</label>
                                    <p class="form-control-plaintext" th:text="${task.assignStaffName}"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">优先级</label>
                                    <p class="form-control-plaintext">
                                        <span th:if="${task.priority == '高'}" class="badge bg-danger">高</span>
                                        <span th:if="${task.priority == '中'}" class="badge bg-warning">中</span>
                                        <span th:if="${task.priority == '低'}" class="badge bg-success">低</span>
                                    </p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">状态</label>
                                    <p class="form-control-plaintext">
                                        <span th:if="${task.status == '待处理'}" class="badge bg-info">待处理</span>
                                        <span th:if="${task.status == '处理中'}" class="badge bg-warning">处理中</span>
                                        <span th:if="${task.status == '已完成'}" class="badge bg-success">已完成</span>
                                        <span th:if="${task.status == '已取消'}" class="badge bg-danger">已取消</span>
                                    </p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">创建时间</label>
                                    <p class="form-control-plaintext" th:text="${task.createTime}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">开始时间</label>
                                    <p class="form-control-plaintext" th:text="${task.startTime}"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">完成时间</label>
                                    <p class="form-control-plaintext" th:text="${task.completeTime}"></p>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">任务描述</label>
                            <p class="form-control-plaintext" th:text="${task.description}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">处理人</label>
                            <p class="form-control-plaintext" th:text="${task.handler}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <p class="form-control-plaintext" th:text="${task.remark}"></p>
                        </div>
                        <div class="mb-3">
                            <a href="/task/list" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> 返回</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="/static/plugins/bootstrap-5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="/static/plugins/jquery-3.7.0/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
