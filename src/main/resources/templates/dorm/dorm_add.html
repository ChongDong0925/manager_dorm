<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增/编辑宿舍 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fa fa-home"></i> <span th:if="${dorm != null}">编辑宿舍</span><span th:unless="${dorm != null}">新增宿舍</span></h3>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/dorm/save}" method="post">
                            <input type="hidden" id="id" name="id" th:value="${dorm?.id}">
                            <div class="mb-3">
                                <label for="dormNumber" class="form-label">宿舍号</label>
                                <input type="text" class="form-control" id="dormNumber" name="dormNumber" th:value="${dorm?.dormNumber}" required>
                            </div>
                            <div class="mb-3">
                                <label for="building" class="form-label">楼栋</label>
                                <input type="text" class="form-control" id="building" name="building" th:value="${dorm?.building}" required>
                            </div>
                            <div class="mb-3">
                                <label for="floor" class="form-label">楼层</label>
                                <input type="number" class="form-control" id="floor" name="floor" th:value="${dorm?.floor}" required>
                            </div>
                            <div class="mb-3">
                                <label for="roomType" class="form-label">房间类型</label>
                                <select class="form-select" id="roomType" name="roomType" required>
                                    <option value="4人间" th:selected="${dorm?.roomType == '4人间'}">4人间</option>
                                    <option value="6人间" th:selected="${dorm?.roomType == '6人间'}">6人间</option>
                                    <option value="8人间" th:selected="${dorm?.roomType == '8人间'}">8人间</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="capacity" class="form-label">容纳人数</label>
                                <input type="number" class="form-control" id="capacity" name="capacity" th:value="${dorm?.capacity}" required>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">状态</label>
                                <select class="form-select" id="status" name="status" required>
                                    <option value="可用" th:selected="${dorm?.status == '可用'}">可用</option>
                                    <option value="维修中" th:selected="${dorm?.status == '维修中'}">维修中</option>
                                    <option value="禁用" th:selected="${dorm?.status == '禁用'}">禁用</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">描述</label>
                                <textarea class="form-control" id="description" name="description" rows="3" th:text="${dorm?.description}"></textarea>
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                                <a href="/dorm/list" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> 返回</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
