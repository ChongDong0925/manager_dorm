<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤打卡 - 宿舍管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">宿舍管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">大屏监控</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dorm/list">宿舍管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/task/list">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/schedule/list">排班管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/attendance/list">考勤管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/staff/list">人员管理</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container-fluid mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fa fa-clock-o"></i> 考勤打卡</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h4>上班打卡</h4>
                                <form th:action="@{/attendance/checkIn}" method="post">
                                    <div class="mb-3">
                                        <label for="staffIdIn" class="form-label">人员</label>
                                        <select class="form-select" id="staffIdIn" name="staffId" required>
                                            <option value="">请选择人员</option>
                                            <option th:each="staff : ${staffs}" th:value="${staff.id}" th:text="${staff.name}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="attendanceDateIn" class="form-label">考勤日期</label>
                                        <input type="date" class="form-control" id="attendanceDateIn" name="attendanceDate" required>
                                    </div>
                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-success w-100"><i class="fa fa-sign-in"></i> 上班打卡</button>
                                    </div>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <h4>下班打卡</h4>
                                <form th:action="@{/attendance/checkOut}" method="post">
                                    <div class="mb-3">
                                        <label for="staffIdOut" class="form-label">人员</label>
                                        <select class="form-select" id="staffIdOut" name="staffId" required>
                                            <option value="">请选择人员</option>
                                            <option th:each="staff : ${staffs}" th:value="${staff.id}" th:text="${staff.name}"></option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="attendanceDateOut" class="form-label">考勤日期</label>
                                        <input type="date" class="form-control" id="attendanceDateOut" name="attendanceDate" required>
                                    </div>
                                    <div class="mb-3">
                                        <button type="submit" class="btn btn-danger w-100"><i class="fa fa-sign-out"></i> 下班打卡</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-12">
                                <div th:if="${message}" class="alert alert-info">
                                    <span th:text="${message}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">© 2026 宿舍管理系统</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- 通用JS -->
    <script src="/static/js/common.js"></script>
</body>
</html>
